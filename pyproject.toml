
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "german-e-invoices"
version = "0.1.0"
description = "German E-Invoice Processing and Validation System"
requires-python = ">=3.10"

dependencies = [
    "pdfplumber",
    "PyMuPDF",
    "pydantic",
    "Faker",
    "Jinja2",
    "lxml",
    "weasyprint"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "python-dotenv"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

